<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Health Insurance Calculator</title>
	<style>
		body { font-family: sans-serif; line-height: 1.5; padding: 20px; }
		pre { background: #f4f4f4; padding: 10px; border: 1px solid #ccc; overflow-x: auto; }
		.success { color: green; }
		.error { color: red; }
		.test-section { margin-bottom: 20px; padding: 10px; border-bottom: 1px solid #eee; }
		input { margin: 5px; }
		h3 { margin-bottom: 5px; }
		.result-box { margin-top: 10px; font-weight: bold; }
	</style>
</head>
<body>

	<h1>Health Insurance Calculator Dashboard</h1>
	<p>Target: <code>https://hirc-server-a3deh6hud4fnfjdh.canadacentral-01.azurewebsites.net/</code></p>

	<!-- BP -->
	<div class="test-section">
		<h3>Blood Pressure Category</h3>
		Systolic: <input type="number" id="bpSystolic" value="145">
		Diastolic: <input type="number" id="bpDiastolic" value="95">
		<button onclick="testBpCategory()">Calculate</button>

		<div id="bpResult" class="result-box"></div>
	</div>

	<!-- BMI -->
	<div class="test-section">
		<h3>BMI Calculator</h3>
		Feet: <input type="number" id="bmiFeet" value="5">
		Inches: <input type="number" id="bmiInches" value="11">
		Weight (lbs): <input type="number" id="bmiWeight" value="185">
		<button onclick="testBmi()">Calculate</button>

		<div id="bmiResult" class="result-box"></div>
	</div>

	<!-- Risk -->
	<div class="test-section">
		<h3>Risk Category</h3>
		Age: <input type="number" id="riskAge" value="35">
		BMI Category: <input type="text" id="riskBmiCat" value="overweight">
		BP Category: <input type="text" id="riskBpCat" value="stage 2">
		Family History: <input type="text" id="riskFamily" value="diabetes, heart disease">
		<button onclick="testRiskCategory()">Calculate</button>

		<div id="riskResult" class="result-box"></div>
	</div>

	<!-- Logs -->
	<div class="test-section">
		<h3>API Logs</h3>
		<button onclick="runUtilityTests()">Run Root & Ping</button>
		<button onclick="resultsContainer.innerHTML = ''" style="color: brown;">Clear Logs</button>
	</div>

	<div id="test-results"></div>

	<script>
		const baseUrl = 'https://hirc-server-a3deh6hud4fnfjdh.canadacentral-01.azurewebsites.net/';
		const resultsContainer = document.getElementById('test-results');

		const logResult = (endpoint, status, data, isError = false) => {
			const section = document.createElement('div');
			const timestamp = new Date().toLocaleTimeString();

			section.innerHTML = `<h3>[${timestamp}] ${endpoint} - 
				<span class="${isError ? 'error' : 'success'}">Status: ${status}</span></h3>`;

			const pre = document.createElement('pre');
			pre.className = isError ? 'error' : 'success';
			pre.textContent = JSON.stringify(data, null, 2);

			section.appendChild(pre);
			resultsContainer.prepend(section);
		};

		// Utility tests
		async function runUtilityTests() {
			try {
				const rootRes = await fetch(`${baseUrl}/`);
				const rootText = await rootRes.text();
				logResult('/', rootRes.status, { response: rootText }, !rootRes.ok);

				const pingRes = await fetch(`${baseUrl}/ping`);
				const pingJson = await pingRes.json();
				logResult('/ping', pingRes.status, pingJson, !pingRes.ok);
			} catch (err) {
				logResult('Error', 0, { message: err.message }, true);
			}
		}

		// BP
		async function testBpCategory() {
			try {
				const systolic = parseInt(document.getElementById('bpSystolic').value);
				const diastolic = parseInt(document.getElementById('bpDiastolic').value);

				const res = await fetch(`${baseUrl}/api/bp-category`, {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({ systolic, diastolic })
				});

				const data = await res.json();

				document.getElementById('bpResult').innerHTML =
					`Category: ${data.category}`;

				logResult('/api/bp-category', res.status, data, !res.ok);

			} catch (err) {
				logResult('/api/bp-category', 0, { error: err.message }, true);
			}
		}

		// BMI
		async function testBmi() {
			try {
				const heightFeet = parseInt(document.getElementById('bmiFeet').value);
				const heightInches = parseInt(document.getElementById('bmiInches').value);
				const weightPounds = parseInt(document.getElementById('bmiWeight').value);

				const res = await fetch(`${baseUrl}/api/bmi`, {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({ heightFeet, heightInches, weightPounds })
				});

				const data = await res.json();

				document.getElementById('bmiResult').innerHTML =
					`BMI: ${data.bmi} (${data.category})`;

				logResult('/api/bmi', res.status, data, !res.ok);

			} catch (err) {
				logResult('/api/bmi', 0, { error: err.message }, true);
			}
		}

		// Risk
		async function testRiskCategory() {
			try {
				const age = parseInt(document.getElementById('riskAge').value);
				const bmiCategory = document.getElementById('riskBmiCat').value;
				const bpCategory = document.getElementById('riskBpCat').value;

				const familyHistoryRaw = document.getElementById('riskFamily').value;
				const familyHistory = familyHistoryRaw
					.split(',')
					.map(item => item.trim())
					.filter(item => item !== '');

				const res = await fetch(`${baseUrl}/api/risk-category`, {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({
						age,
						bmiCategory,
						bpCategory,
						familyHistory
					})
				});

				const data = await res.json();

				document.getElementById('riskResult').innerHTML =
					`Risk Level: ${data.riskLevel}`;

				logResult('/api/risk-category', res.status, data, !res.ok);

			} catch (err) {
				logResult('/api/risk-category', 0, { error: err.message }, true);
			}
		}

		// Run initial check
		runUtilityTests();
	</script>

</body>
</html>
